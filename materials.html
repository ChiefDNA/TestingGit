<!DOCTYPE html>
<html>
    <head>
        <title>Manage Materials</title>
        <link rel="icon" href="assets/images/logo.png" type="image/png">
        <link rel="stylesheet" href="assets/css/styles.css">
    </head>
    <body>
        <div id="sidePanel"></div>
        <section class="section">
            <div class="container left">
                <div class="heading container">
                    <h2>Material Purchase History</h2>
                    <hr>
                </div>
                <div class="table-space">
                    <div class="table-boundary history" >
                        <div class="table-wrap">
                            <table class="mat-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>TYPE</th>
                                        <th>NAME</th>
                                        <th>SUPPLIER</th>
                                        <th>UNIT COST</th>
                                        <th>TOTAL QUANTITY</th>
                                        <th>ADDED BY</th>
                                        <th>DATE ADDED</th>
                                    </tr>
                                </thead>
                                <tbody class="table-entries">

                                </tbody>
                            </table>
                        </div>
                            <div class="table-controls">
                                <label>
                                Show 
                                <select id="entries-per-page">
                                    <option value="10">10</option>
                                    <option value="15">15</option>
                                    <option value="20">20</option>
                                    <option value="30">30</option>
                                    <option value="50">50</option>
                                </select>
                                entries per page
                                </label>
                            
                                <div class="pagination">
                                <button id="prev-page">&lt;</button>
                                <span id="page-display">Page <select id="page-jump">1</select> of <span>1</span></span>
                                <button id="next-page">&gt;</button>
                                </div>
                            </div>
                    </div>
                </div>
            </div>
        </section>
        <script src="assets/javascript/scripts.js"></script>
    </body>
</html>
